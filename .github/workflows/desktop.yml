name: Desktop apps

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macOS-AppleSilicon
            architecture: arm64
          - os: macos-15-intel
            name: macOS-Intel
            architecture: x64
          - os: windows-latest
            name: Windows-x64
            architecture: x64
          - os: ubuntu-22.04
            name: Linux-x64
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Build native app and archive
        run: python tools/build_desktop.py
      - name: Test packaged app and download workers
        run: python tools/smoke_desktop.py
      - name: Verify macOS signature after test
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict build/desktop/Frame.app
      - uses: actions/upload-artifact@v7
        with:
          name: Frame-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
